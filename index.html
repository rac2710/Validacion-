<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Certificado - Fundación Niño Zuliano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; border-top: 6px solid #1a73e8; }
    h2 { color: #1a73e8; font-size: 20px; margin-bottom: 10px; }
    p { color: #5f6368; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
    .btn { display: block; width: 100%; background-color: #1a73e8; color: #ffffff; padding: 14px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; }
    .btn:hover { background-color: #1557b0; }
    .footer { margin-top: 15px; font-size: 12px; color: #9aa0a6; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Fundación Niño Zuliano</h2>
    <p>Haz clic en el siguiente botón para consultar la validez oficial del certificado en nuestro sistema.</p>

    <!-- target="_blank" obliga a la app del QR a abrir Chrome/Safari real -->
    <a id="btnVerificar" href="#" target="_blank" rel="noopener noreferrer" class="btn">Verificar Certificado</a>
    
    <div class="footer">Sistema Oficial de Validaciones</div>
  </div>

  <script>
    window.onload = function() {
      var urlParams = new URLSearchParams(window.location.search);
      var codigo = urlParams.get('codigo') || '';

      var scriptUrl = "https://script.google.com/macros/s/AKfycby6oDFqjhpI8hbvUPRkRVTV-361a4Rwq-RhRCTvV8_VQ2ATlaGPI5bjSXj7LzmSrkPG/exec";
      var destino = codigo.trim() !== "" ? scriptUrl + "#codigo=" + encodeURIComponent(codigo) : scriptUrl;

      var boton = document.getElementById('btnVerificar');
      boton.href = destino;
    };
  </script>

</body>
</html>
